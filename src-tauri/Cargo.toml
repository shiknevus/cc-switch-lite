[package]
name = "cc-switch-lite"
version = "1.3.2"
description = "Lightweight usage and cost statistics assistant for AI coding tools"
authors = ["Jason Young", "CC Switch Team"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "cc_switch_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = []

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-utils = "2.10.2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
auto-launch = "0.5"
dirs = "5.0"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
thiserror = "2.0"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks", "functions"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"

